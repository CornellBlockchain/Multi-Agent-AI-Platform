[pytest]
# Live tests call real services; run them with:  python -m pytest -m live
# Prompt tests call real Gemini (costs calls); run them with:  python -m pytest -m prompt
markers =
    live: calls a real external API (needs keys and network)
    prompt: real Gemini chooses tools; checks the agent's behaviour, not its plumbing
addopts = -m "not live and not prompt"
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore:Using `httpx` with `starlette.testclient`
